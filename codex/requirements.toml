# Codex CLIのrequirements（/etc/codex/requirements.toml）。nix/darwin/codex.nixのactivation scriptで配置する
# Claudeのclaude/managed-settings.jsonに相当する層で、ユーザーは上書きできず、CLIフラグでも外せない
# 既定値（approval_policyなど）はmanaged_config.tomlに置き、ここには強制したい制約だけを書く
# 対応表はdocs/codex-sandbox.mdを参照。Claude側を変えたらここも揃える

# Claudeのdisableが近いもの: danger-full-accessや確認なし実行（never）への切り替えを禁止する
allowed_approval_policies = ["on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]

# profileはdotfilesと:read-onlyだけ選べる。:workspaceはdeny・ドメイン制限がない素の状態なので許可しない
# :danger-full-accessも許可しない。許可してもrulesのallowや承認つき昇格はコマンドをsandbox外に出さず（実機で確認）、
# バイパス禁止（--dangerously-bypass-approvals-and-sandboxの無効化）を失うだけになる
default_permissions = "dotfiles"

[allowed_permission_profiles]
dotfiles = true
":read-only" = true

[permissions.dotfiles]
description = "claude/managed-settings.jsonのsandbox設定に揃えたprofile"
extends = ":workspace"

# Claudeのsandbox.filesystem.allowWrite（~/.claude/logsはClaude専用のため除外）
[permissions.dotfiles.filesystem]
"~/.gradle" = "write"
"~/Library/Caches/go-build" = "write"
"~/go/pkg/mod" = "write"
"~/Library/Caches/golangci-lint" = "write"
"~/.docker/buildx" = "write"
# Claudeのsandbox.filesystem.denyWrite。GradleのinitスクリプトはIDEからのビルドでも実行される
"~/.gradle/init.d" = "read"
"~/.gradle/init.gradle" = "read"
"~/.gradle/gradle.properties" = "none"
# zshが起動のたびに読む.env。書き換えられるとsandbox外で任意コードが動く
"~/workspaces/github.com/yyh-gl/dotfiles/.env" = "none"

[permissions.dotfiles.network]
enabled = true
# limitedはGET/HEAD/OPTIONSのみ許可する。Claudeの許可ドメインはメソッドを制限しないためfullにする
mode = "full"

# Claudeのsandbox.credentials.files・permissions.denyのRead(...)。ワークスペース外にも効く
[permissions.filesystem]
deny_read = [
  "~/.aws/credentials",
  "~/.kube/config",
  "~/.local/share/deck/credentials.json",
  "~/.ssh",
  "~/.config/gh/hosts.yml",
  "~/.config/gcloud",
  "~/.docker/config.json",
  "~/.terraform.d/credentials.tfrc.json",
  "~/.npmrc",
  "~/.netrc",
  "~/.git-credentials",
  "~/.pypirc",
  "~/.gradle/gradle.properties",
  "~/.config/op",
  "/**/.env",
  "/**/.env.local",
  "/**/.env.*.local",
  "/**/.env.production",
  "/**/.env.development",
  "/**/.env.staging",
  "/**/.env.test",
  "/**/secrets/**",
  "/**/credentials/**",
  "/**/terraform.tfvars",
  "/**/*.pem",
  "/**/*.key",
]

# Claudeのsandbox.network.allowedDomains
# managed_allowed_domains_onlyは設定しない（Claudeのallowedは設定間で足し合わされるのと同じ挙動）
[experimental_network]
enabled = true

[experimental_network.domains]
"github.com" = "allow"
"raw.githubusercontent.com" = "allow"
"objects.githubusercontent.com" = "allow"
"registry.npmjs.org" = "allow"
"proxy.golang.org" = "allow"
"sum.golang.org" = "allow"
"services.gradle.org" = "allow"
"plugins.gradle.org" = "allow"
"repo.maven.apache.org" = "allow"
"repo1.maven.org" = "allow"
"dl.google.com" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"

# requirementsのrulesはdecisionにpromptかforbiddenしか書けない（allowはsandbox外実行にならず承認を省くだけなので使わない）
# 前方一致なので`git -C dir push`・`env git push`・`GH_CONFIG_DIR=x gh pr create`のような環境変数の前置は一致しない。
# Claudeの`Bash(git push*)`と同じ弱点で、実質の防御はsandbox（~/.ssh・gh認証情報のdeny、api.github.comが許可ドメインにないこと）が担う
[rules]
prefix_rules = [
  # --- forbidden（Claudeのpermissions.deny） ---
  { pattern = [{ token = "git" }, { token = "push" }], decision = "forbidden", justification = "pushは人間が行う" },
  # gitleaksのpre-commit hookを飛ばさせない。前方一致なので`git commit -m x --no-verify`のような後ろ付きは防げない（Claude側は後ろ付きもdeny）
  { pattern = [{ token = "git" }, { token = "commit" }, { token = "--no-verify" }], decision = "forbidden", justification = "hookを飛ばさない" },
  { pattern = [{ token = "git" }, { token = "commit" }, { token = "-n" }], decision = "forbidden", justification = "hookを飛ばさない" },
  # 認証情報・鍵・任意コード実行の経路になるため使わせない（Claudeのpermissions.deny）
  { pattern = [{ token = "gh" }, { token = "auth" }], decision = "forbidden", justification = "トークンを出さない" },
  { pattern = [{ token = "gh" }, { token = "ssh-key" }], decision = "forbidden", justification = "鍵を登録させない" },
  { pattern = [{ token = "gh" }, { token = "gpg-key" }], decision = "forbidden", justification = "鍵を登録させない" },
  { pattern = [{ token = "gh" }, { token = "extension" }], decision = "forbidden", justification = "任意コードの実行経路になる" },

  # --- prompt（Claudeのpermissions.ask） ---
  { pattern = [{ token = "git" }, { token = "rm" }], decision = "prompt" },
  { pattern = [{ token = "chmod" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "create" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "merge" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "close" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "edit" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "issue" }, { token = "create" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "issue" }, { token = "edit" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "issue" }, { token = "close" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "repo" }, { token = "create" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "repo" }, { token = "delete" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "release" }, { token = "create" }], decision = "prompt" },
