  { pattern = [{ token = "gh" }, { token = "secret" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "api" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "gist" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "comment" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "review" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "ready" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "reopen" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "issue" }, { token = "comment" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "issue" }, { token = "delete" }], decision = "prompt" },
