  { pattern = [{ token = "gh" }, { token = "ruleset" }], decision = "prompt" },
  { pattern = [{ token = "gh" }, { token = "alias" }], decision = "prompt" },
  # Claudeのaskはdockerの書き込み・実行系サブコマンドの列挙（参照系のdocker ps等はallowで、確認なし）。同じ範囲にする
  # ただしCodexでは承認してもsandbox内で動き、dockerのsocketに届かず失敗する（意図的な差分）
